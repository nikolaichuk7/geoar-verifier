<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <style>
    text{fill:#0f172a}
    .t{font-weight:700}
    .s{fill:#475569}
    .m{font-family:'DejaVu Sans Mono','Menlo','Courier New',monospace}
    .lbl{fill:#475569;font-size:11px}
    .grp{fill:#94a3b8;font-style:italic;font-size:12px}
    .chk{fill:#334155;font-size:11.5px}
  </style>

  <text x="440" y="40" text-anchor="middle" class="t" font-size="17">Relaying the Section 5.1.1 binder on AMD SEV-SNP</text>

  <!-- guest boundary -->
  <rect x="44" y="92" width="360" height="350" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="5 5"/>
  <text x="52" y="84" class="grp">one SEV-SNP guest — run as server, then as attacker</text>

  <!-- handshake -->
  <rect x="88" y="112" width="268" height="60" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="1.4"/>
  <text x="222" y="136" text-anchor="middle" class="t m" font-size="13.5">handshake_stdlib.py</text>
  <text x="222" y="156" text-anchor="middle" class="s" font-size="11.5">real TLS 1.3 · captures CH…SH transcript</text>

  <!-- binder -->
  <rect x="88" y="200" width="268" height="54" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="1.4"/>
  <text x="222" y="223" text-anchor="middle" class="t m" font-size="13.5">binder.py</text>
  <text x="222" y="242" text-anchor="middle" class="s" font-size="11.5">computes s_attest_binder (HKDF)</text>

  <!-- firmware -->
  <rect x="88" y="282" width="268" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="222" y="304" text-anchor="middle" class="t" font-size="13.5">SNP firmware</text>
  <text x="222" y="322" text-anchor="middle" class="s m" font-size="11.5">SNP_GET_REPORT</text>
  <text x="222" y="337" text-anchor="middle" class="s" font-size="10.5">signs any REPORT_DATA — no key check</text>

  <!-- report -->
  <rect x="88" y="376" width="268" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="222" y="399" text-anchor="middle" class="t" font-size="13.5">VCEK-signed report</text>
  <text x="222" y="418" text-anchor="middle" class="s" font-size="11.5">+ certificate chain</text>

  <!-- verifier -->
  <rect x="500" y="112" width="344" height="318" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="672" y="140" text-anchor="middle" class="t m" font-size="14" fill="#065f46">verify_run.py</text>
  <text x="672" y="160" text-anchor="middle" class="s" font-size="11.5" fill="#047857">the Section 5.1.2 client (offline)</text>
  <line x1="524" y1="176" x2="820" y2="176" stroke="#a7f3d0" stroke-width="1"/>
  <text x="524" y="204" class="chk">1 · recompute binder from the transcript it saw + SPKI</text>
  <text x="524" y="232" class="chk">2 · check  REPORT_DATA = binder</text>
  <text x="524" y="260" class="chk">3 · verify report signature (ECDSA-P384)</text>
  <text x="524" y="288" class="chk">4 · verify chain to ARK-Milan</text>
  <text x="524" y="316" class="chk">5 · check  hwID = CHIP_ID</text>
  <text x="672" y="360" text-anchor="middle" class="t" font-size="12" fill="#065f46">accepts — yet CHIP_ID is the attacker's chip</text>
  <text x="672" y="380" text-anchor="middle" class="s" font-size="10.5" fill="#047857">different machine, different country, same key</text>

  <!-- KDS -->
  <rect x="572" y="452" width="200" height="50" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.4"/>
  <text x="672" y="474" text-anchor="middle" class="t" font-size="13" fill="#065f46">AMD KDS</text>
  <text x="672" y="491" text-anchor="middle" class="s" font-size="11" fill="#047857">ARK-Milan root</text>

  <!-- arrows -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="ars" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M7.5,0 L0,3 L7.5,6 Z" fill="#334155"/></marker>
  </defs>
  <!-- vertical pipeline -->
  <line x1="222" y1="172" x2="222" y2="198" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="222" y1="254" x2="222" y2="280" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="222" y1="344" x2="222" y2="374" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="230" y="258" width="102" height="16" fill="#ffffff"/>
  <text x="234" y="270" class="lbl">REPORT_DATA</text>
  <!-- single data arrow: report -> verifier (the client already observed the handshake) -->
  <line x1="356" y1="403" x2="498" y2="403" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="404" y="386" width="92" height="16" fill="#ffffff"/>
  <text x="494" y="398" text-anchor="end" class="lbl">report + chain</text>
  <!-- verifier <-> KDS -->
  <line x1="672" y1="430" x2="672" y2="450" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)" marker-start="url(#ars)"/>
</svg>
